<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>LoanAssist AI</title>

<style>

body{
    margin:0;
    font-family: Arial;

    /* ⭐ BLUE + PINK GRADIENT BACKGROUND */
    background: linear-gradient(135deg,#0d1117,#0b3d91,#ff007f);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;

    color:white;
}

/* smooth animated background */
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.header{
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.chatbox{
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border-radius:12px;
    padding:15px;
    min-height:400px;
}

.message{
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    max-width:80%;
}

.user{
    background:#238636;
    margin-left:auto;
}

.ai{
    background:#1f6feb;
}

.input-area{
    margin-top:15px;
    display:flex;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    background:#ff007f;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff4da6;
}

</style>
</head>

<body>

<div class="container">

<div class="header">🤖 LoanAssist AI</div>

<div id="messages" class="chatbox"></div>

<div class="input-area">
<input id="question" placeholder="Ask about loan policies..." />
<button onclick="send()">Send</button>
</div>

</div>


<script>

const API_URL = "https://9ypgue0fw9.execute-api.us-east-1.amazonaws.com/chat";

window.onload=function(){

addMessage(
"👋 Hello! I am LoanAssist AI.\n\nAsk me anything about loans, policies, or documents 🙂",
"ai");

}

async function send(){

    const input=document.getElementById("question");
    const question=input.value;

    if(!question) return;

    addMessage(question,"user");

    input.value="";

    const loading=addMessage("Typing...","ai");

    const response=await fetch(API_URL,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            question:question
        })
    });

    
    const data=await response.json();

    let responseText = data.answer;

/* SHOW SOURCES */
    if(data.sources && data.sources.length > 0){

        responseText += "\n\n📚 Sources:\n";

        data.sources.forEach((src,index)=>{

            const fileName =
            src.source.split("/").pop();

            responseText +=
            `\n${index+1}. ${fileName}`;

    });

}

loading.innerText = responseText;
}

function addMessage(text,type){

    const div=document.createElement("div");
    div.className="message "+type;
    div.innerText=text;

    document.getElementById("messages").appendChild(div);

    return div;
}

</script>

</body>
</html>
