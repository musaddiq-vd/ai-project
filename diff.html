

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanAssist AI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0d1117,#0b3d91,#ff007f);
    background-size:400% 400%;
    animation:gradientMove 12s ease infinite;
    color:white;
    overflow:hidden;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(12px);
    padding:20px;
    overflow-y:auto;
    border-right:1px solid rgba(255,255,255,0.1);
}

.sidebar-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.new-chat{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1f6feb;
    color:white;
    cursor:pointer;
    margin-bottom:20px;
    transition:0.3s;
}

.new-chat:hover{
    background:#388bfd;
}

.chat-history-wrapper{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.08);
    border-radius:8px;
    margin-bottom:10px;
    padding-right:8px;
    transition:0.3s;
}

.chat-history-wrapper:hover{
    background:rgba(255,255,255,0.18);
}

.active-chat{
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.18);
}

.chat-history{
    flex:1;
    padding:12px;
    cursor:pointer;
    word-wrap:break-word;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.delete-chat-btn{
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.5);
    cursor:pointer;
    font-size:16px;
    padding:5px;
    margin-left:5px;
    border-radius:4px;
    transition:0.3s;
}

.delete-chat-btn:hover{
    color:#ff4d5e;
    background:rgba(255,0,0,0.1);
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:30px;
    font-weight:bold;
}

.clear-btn{
    background:#dc3545;
}

.clear-btn:hover{
    background:#ff4d5e;
}

.chatbox{
    flex:1;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(10px);
    border-radius:12px;
    padding:15px;
    overflow-y:auto;
    scroll-behavior:smooth;
}

.message{
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    max-width:80%;
    white-space:pre-wrap;
    line-height:1.5;
    position:relative;
    animation:fadeIn 0.2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0px);
    }
}

.user{
    background:#238636;
    margin-left:auto;
}

.ai{
    background:#1f6feb;
}

.feedback{
    margin-top:8px;
    font-size:18px;
}

.feedback span{
    cursor:pointer;
    margin-right:10px;
}

.input-area{
    margin-top:15px;
    display:flex;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
    outline:none;
    font-size:15px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    background:#ff007f;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff4da6;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.typing{
    display:flex;
    gap:5px;
}

.typing span{
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:0.2s;
}

.typing span:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:scale(0.7);
        opacity:0.5;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}

/* MOBILE */
@media(max-width:768px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:220px;
    }

    .main{
        padding:10px;
    }

    .message{
        max-width:95%;
    }

    .title{
        font-size:22px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-title">
            💬 Chats
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            + New Chat
        </button>

        <div id="chatList"></div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="header">

            <div class="title">
                🤖 LoanAssist AI
            </div>

            <button
                class="clear-btn"
                onclick="clearCurrentChat()"
            >
                Clear Chat
            </button>

        </div>

        <div id="messages" class="chatbox"></div>

        <div class="input-area">

            <input
                id="question"
                maxlength="1000"
                placeholder="Ask about loan policies..."
                autocomplete="off"
            />

            <button
                id="sendBtn"
                onclick="send()"
            >
                Send
            </button>

            <button
                id="stopBtn"
                onclick="stopResponse()"
                style="display:none;background:#dc3545;"
            >
                Stop
            </button>

        </div>

    </div>

</div>

<script>

const API_URL =
"https://9ypgue0fw9.execute-api.us-east-1.amazonaws.com/chat";

const STORAGE_KEY =
"loanassist_chats";

/* LOAD CHATS */
let chats =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
) || {};

let currentChatId = null;

let currentInterval = null;

let stopGeneration = false;

/* SAVE */
function saveChats(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

}

/* INITIAL */
window.onload=function(){

    refreshSidebar();

    const keys =
    Object.keys(chats);

    if(keys.length > 0){

        loadChat(keys[0]);

    }

    else{

        createNewChat();

    }

}

/* REFRESH SIDEBAR */
function refreshSidebar(){

    const chatList =
    document.getElementById("chatList");

    chatList.innerHTML = "";

    Object.keys(chats).reverse().forEach(chatId=>{

        addSidebarChat(
            chatId,
            chats[chatId].title || "New Chat"
        );

    });

}

/* GENERATE TITLE */
function generateTitle(question){

    let title = question
    .toLowerCase()
    .replace("what is","")
    .replace("tell me about","")
    .replace("explain","")
    .replace("can you","")
    .replace("please","")
    .trim();

    title =
    title.charAt(0).toUpperCase() +
    title.slice(1);

    if(title.length > 20){

        title =
        title.substring(0,20) + "...";

    }

    return title || "Loan Info";

}

/* CREATE CHAT */
function createNewChat(){

    const chatId =
    "chat-" + Date.now();

    currentChatId = chatId;

    chats[chatId] = {
        title:"New Chat",
        messages:""
    };

    saveChats();

    refreshSidebar();

    loadChat(chatId);

}

/* ADD SIDEBAR */
function addSidebarChat(chatId,title){

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "chat-history-wrapper";

    if(chatId === currentChatId){

        wrapper.classList.add("active-chat");

    }

    const chatItem =
    document.createElement("div");

    chatItem.className =
    "chat-history";

    chatItem.innerText =
    title;

    chatItem.onclick = () => {

        loadChat(chatId);

    };

    const deleteBtn =
    document.createElement("button");

    deleteBtn.className =
    "delete-chat-btn";

    deleteBtn.innerHTML = "🗑️";

    deleteBtn.title =
    "Delete Chat";

    deleteBtn.onclick = (e) => {

        e.stopPropagation();

        deleteChat(chatId);

    };

    wrapper.appendChild(chatItem);

    wrapper.appendChild(deleteBtn);

    document
    .getElementById("chatList")
    .appendChild(wrapper);

}

/* DELETE CHAT */
function deleteChat(chatId){

    if(confirm("Delete this chat?")){

        delete chats[chatId];

        saveChats();

        refreshSidebar();

        if(currentChatId === chatId){

            const remainingKeys =
            Object.keys(chats);

            if(remainingKeys.length > 0){

                loadChat(
                    remainingKeys[0]
                );

            }

            else{

                createNewChat();

            }

        }

    }

}

/* LOAD CHAT */
function loadChat(chatId){

    currentChatId = chatId;

    refreshSidebar();

    const messages =
    document.getElementById("messages");

    messages.innerHTML =
    chats[chatId].messages;

    if(messages.innerHTML.trim()===""){

        addMessage(
        "👋 Hello! I am LoanAssist AI.\n\nAsk me anything about loans, policies, or documents 🙂",
        "ai"
        );

    }

}

/* NEW CHAT */
function newChat(){

    if(currentChatId &&
       chats[currentChatId]){

        chats[currentChatId].messages =
        document.getElementById(
            "messages"
        ).innerHTML;

    }

    saveChats();

    createNewChat();

}

/* CLEAR CHAT */
function clearCurrentChat(){

    if(!confirm("Clear current chat?")){
        return;
    }

    document.getElementById(
        "messages"
    ).innerHTML = "";

    chats[currentChatId].messages = "";

    saveChats();

}

/* STOP RESPONSE */
function stopResponse(){

    stopGeneration = true;

    clearInterval(currentInterval);

    document.getElementById(
        "stopBtn"
    ).style.display = "none";

    document.getElementById(
        "sendBtn"
    ).style.display = "block";

}

/* ENTER KEY */
document
.getElementById("question")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        send();

    }

});

/* SEND */
async function send(){

    const input =
    document.getElementById("question");

    const question =
    input.value.trim();

    if(!question) return;

    stopGeneration = false;

    input.disabled = true;

    document.getElementById(
        "sendBtn"
    ).style.display = "none";

    document.getElementById(
        "stopBtn"
    ).style.display = "block";

    /* TITLE */
    if(chats[currentChatId].title === "New Chat"){

        const smartTitle =
        generateTitle(question);

        chats[currentChatId].title =
        smartTitle;

        saveChats();

        refreshSidebar();

    }

    addMessage(question,"user");

    input.value="";

    /* TYPING */
    const loading =
    addTypingAnimation();

    try{

        const response =
        await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                question:question
            })

        });

        if(!response.ok){
            throw new Error("API Error");
        }

        const data =
        await response.json();

        let responseText =
        data.answer ||
        "No response received.";

        /* SOURCES */
        if(data.sources &&
           data.sources.length > 0){

            responseText +=
            "\n\n📚 Sources:\n";

            const uniqueFiles =
            [...new Set(

                data.sources.map(
                    src =>
                    src.source
                    .split("/")
                    .pop()
                )

            )];

            uniqueFiles.forEach(
            (file,index)=>{

                responseText +=
                `\n${index+1}. ${file}`;

            });

        }

        loading.innerHTML = "";

        typeText(
            loading,
            responseText
        );

    }

    catch(error){

        loading.innerText =
        "⚠️ Failed to connect. Please try again.";

        finishMessage(loading);

    }

    finally{

        input.disabled = false;

        input.focus();

    }

}

/* TYPE TEXT */
function typeText(element,text){

    let i = 0;

    currentInterval =
    setInterval(()=>{

        if(stopGeneration){

            clearInterval(currentInterval);

            finishMessage(element);

            return;

        }

        element.textContent +=
        text.charAt(i);

        i++;

        const msgs =
        document.getElementById("messages");

        msgs.scrollTop =
        msgs.scrollHeight;

        if(i >= text.length){

            clearInterval(currentInterval);

            finishMessage(element);

        }

    },15);

}

/* FINISH MESSAGE */
function finishMessage(element){

    addFeedbackButtons(element);

    chats[currentChatId].messages =
    document.getElementById(
        "messages"
    ).innerHTML;

    saveChats();

    document.getElementById(
        "stopBtn"
    ).style.display = "none";

    document.getElementById(
        "sendBtn"
    ).style.display = "block";

}

/* FEEDBACK BUTTONS */
function addFeedbackButtons(messageDiv){

    const feedback =
    document.createElement("div");

    feedback.className =
    "feedback";

    const like =
    document.createElement("span");

    like.innerText = "👍";

    like.onclick = () => {

        like.innerText = "✅ Liked";

        dislike.remove();

    };

    const dislike =
    document.createElement("span");

    dislike.innerText = "👎";

    dislike.onclick = () => {

        dislike.innerText =
        "❌ Disliked";

        like.remove();

    };

    feedback.appendChild(like);

    feedback.appendChild(dislike);

    messageDiv.appendChild(feedback);

}

/* TYPING ANIMATION */
function addTypingAnimation(){

    const div =
    document.createElement("div");

    div.className =
    "message ai";

    div.innerHTML =
    `
    <div class="typing">
        <span></span>
        <span></span>
        <span></span>
    </div>
    `;

    document
    .getElementById("messages")
    .appendChild(div);

    return div;

}

/* ADD MESSAGE */
function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message "+type;

    div.innerText =
    text;

    const msgs =
    document.getElementById("messages");

    msgs.appendChild(div);

    msgs.scrollTop =
    msgs.scrollHeight;

    return div;

}

</script>

</body>
</html>
